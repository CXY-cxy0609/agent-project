root = "."
tmp_dir = "tmp"

[build]
entrypoint = "./cmd/server/main.go"
cmd = "go build -o ./tmp/server ./cmd/server"
bin = "./tmp/server"
full_bin = "./tmp/server"
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["tmp", "vendor", ".git", "node_modules"]
exclude_file = []
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = 300

[log]
time = true

[misc]
clean_on_exit = true

